name: Build & Release

# Every push to main builds Linux + Windows binaries and publishes them as a new
# GitHub release. The `opioid` launcher always downloads the latest release.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "install.sh"
      - "installer/**"
      - "release.sh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Pick version
        run: echo "VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Publish
        run: |
          for rid in linux-x64 win-x64; do
            # Trimming is off: Avalonia (the GUI) leans on reflection for styles and the
            # XAML loader, and trimming it produces a binary that crashes at runtime.
            dotnet publish OpioidMultitool.csproj -c Release -r "$rid" --self-contained \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:PublishTrimmed=false \
              -p:DebugType=none \
              -p:Version="$VERSION" \
              -o "out/$rid"
          done
          mkdir dist
          cp out/linux-x64/OpioidMultitool     dist/OpioidMultitool-linux-x64
          cp out/win-x64/OpioidMultitool.exe   dist/OpioidMultitool-win-x64.exe

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/* \
            --title "v$VERSION" \
            --notes "Automatic build of ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)" \
            --latest
